{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dendronotes.serviceAccountName" . }}
  labels:
    {{- include "dendronotes.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# dendronotes does not talk to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
