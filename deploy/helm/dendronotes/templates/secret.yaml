{{- if not .Values.auth.existingSecret }}
{{- $name := include "dendronotes.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dendronotes.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.admin.passwordHash }}
  admin-password-hash: {{ .Values.auth.admin.passwordHash | b64enc | quote }}
  {{- else if .Values.auth.admin.password }}
  admin-password: {{ .Values.auth.admin.password | b64enc | quote }}
  {{- else if and $old (index $old.data "admin-password") }}
  {{- /* A generated password stays the same across upgrades. */}}
  admin-password: {{ index $old.data "admin-password" | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.oidcClientSecret }}
  oidc-client-secret: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.ldapBindPassword }}
  ldap-bind-password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
