apiVersion: v1
kind: Service
metadata:
  name: {{ include "dendronotes.fullname" . }}
  labels:
    {{- include "dendronotes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dendronotes.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dendronotes.fullname" . }}-metrics
  labels:
    {{- include "dendronotes.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dendronotes.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
