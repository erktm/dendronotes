openapi: 3.1.0
info:
  title: dendronotes API
  version: "1"
  description: |
    JSON API of dendronotes. A soma is the folder of plain Markdown notes that a
    dendronotes server works on. Paths inside the soma are soma-relative,
    "/"-separated and URL-encoded per segment; they may contain "/" even though
    they are a single path parameter here.

    State-changing requests must come from the same origin (checked via
    Sec-Fetch-Site/Origin) and send `Content-Type: application/json`.
    Errors use the `Error` schema with a stable machine-readable code.

    This file is checked against the server's route table by a test
    (internal/server/openapi_test.go).
security:
  - session: []
  - bearer: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is alive.
  /readyz:
    get:
      summary: Readiness probe
      description: 503 while starting, while shutting down, or when the soma is unreachable.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /api/auth/login:
    post:
      summary: Sign in with the password (password mode only)
      description: >
        A local account with a password is checked here. Otherwise, with
        DENDRONOTES_LDAP_URL set, the directory checks the password and the
        account is created or updated from it (source `ldap`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 254
                  description: >
                    User name, or the e-mail address of an account with a password (case-insensitive);
                    an address shared by several accounts signs in to none of them. User name and address
                    share one limit of attempts.
                password: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Signed in; the session cookie is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Account disabled (`account_disabled`) or not in an allowed directory group (`account_not_allowed`).
        "404":
          description: Not available in proxy mode (`not_available`).
        "429":
          description: Too many attempts (`rate_limited`); see the Retry-After header.
        "503":
          description: The directory cannot be reached (`directory_unavailable`).
  /api/auth/logout:
    post:
      summary: Sign out
      security: []
      responses:
        "200":
          description: Session ended. In proxy mode, `logoutUrl` says where to sign out at the proxy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logoutUrl: { type: string }
  /api/auth/me:
    get:
      summary: Who is signed in
      security: []
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/methods:
    get:
      summary: Ways to sign in (for the sign-in page)
      security: []
      responses:
        "200":
          description: >
            `local` says whether the password form is offered to everyone (with
            DENDRONOTES_LOCAL_LOGIN=false only the admin account may use it);
            `sso` is null without OpenID Connect; `passwordReset` offers
            "forgot password" (email is configured).
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [local, proxy] }
                  local: { type: boolean }
                  sso:
                    type: [object, "null"]
                    properties:
                      label: { type: string }
                  passwordReset: { type: boolean }
  /api/auth/banners:
    get:
      summary: The banners of the sign-in page (active, for everyone)
      security: []
      responses:
        "200":
          description: Banners, most important first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners: { type: array, items: { $ref: "#/components/schemas/ShownBanner" } }
  /api/auth/password/forgot:
    post:
      summary: Ask for a link to reset the password by email
      description: >
        Only accounts that may sign in with a password of their own and have
        an email address get a link, at most one every 5 minutes; it works
        once and for one hour. The answer is the same whether an account
        exists or not. Limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string, maxLength: 254, description: User name or email address. }
      responses:
        "202": { description: Accepted (whatever the input). }
        "404": { description: Email or password sign-in is not configured. }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/password/reset:
    post:
      summary: Set a new password with the token from a reset or welcome email
      description: >
        The token is spent; every session of the account ends and the account
        gets a security notice by email. A weak password is refused before
        the token is spent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 10 }
      responses:
        "200":
          description: Password set; sign in with it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/oidc/login:
    get:
      summary: Start signing in through the OpenID Connect provider (browser navigation)
      description: >
        Redirects to the provider (authorization code flow with PKCE, state and
        nonce) and sets a short-lived state cookie. Errors redirect to
        `/?login_error=<code>`.
      security: []
      parameters:
        - { name: next, in: query, schema: { type: string }, description: Path within dendronotes to return to. }
      responses:
        "302": { description: To the provider, or back with `login_error` (sso_unavailable, rate_limited). }
        "404": { description: OpenID Connect is not configured. }
  /api/auth/oidc/callback:
    get:
      summary: Return from the OpenID Connect provider (redirect URI)
      description: >
        Checks state (against the cookie), code, ID token and nonce, finds or
        creates the account and starts a session. Errors redirect to
        `/?login_error=<code>`: sso_failed, sso_expired, sso_denied,
        sso_forbidden, account_disabled.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: To the page the sign-in started from, or back with `login_error`. }
        "404": { description: OpenID Connect is not configured. }
  /api/me:
    patch:
      summary: Change your display name, e-mail or email notifications
      description: >
        Accounts from an OpenID Connect provider or the directory get name and
        address from there (`managed_by_provider`); everyone may change the
        email notifications. A changed address gets a notice at the old one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                email: { type: string }
                mailComments: { type: boolean, description: Mentions and replies that stay unread by email. }
                mailShares: { type: boolean, description: An email when a soma is shared with you. }
      responses:
        "200": { description: The updated account., content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/banners:
    get:
      summary: The banners you see in the app now (your audience, not closed)
      responses:
        "200":
          description: Banners, most important first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners: { type: array, items: { $ref: "#/components/schemas/ShownBanner" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/banners/{id}/dismiss:
    post:
      summary: Close a banner for your account (until its text changes); not with API tokens
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Closed. }
        "400": { description: "The banner cannot be closed (`not_dismissible`)." }
        "404": { description: No such banner. }
  /api/me/password:
    post:
      summary: Change your password (local accounts); your other sessions end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 10 }
      responses:
        "200": { description: Changed. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
  /api/me/tokens:
    get:
      summary: Your personal API tokens (never the tokens themselves)
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema: { type: object, properties: { tokens: { type: array, items: { $ref: "#/components/schemas/APIToken" } } } }
    post:
      summary: Create a personal API token, shown in this answer only (at most 20 per account)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, maxLength: 64 }
                scope: { type: string, enum: [read, write] }
                expiresInDays: { type: integer, minimum: 0, maximum: 3650, description: 0 never expires. }
      responses:
        "201":
          description: The token and what is kept about it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: dn_7Kq… }
                  info: { $ref: "#/components/schemas/APIToken" }
        "400": { description: "`invalid_name`, `invalid_scope` or `invalid_expiry`." }
        "409": { description: Already 20 tokens (`too_many_tokens`). }
  /api/me/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      summary: Revoke one of your tokens
      responses:
        "200": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }
  /api/me/notifications:
    get:
      summary: Your newest notifications (mentions and replies) and how many are unread
      description: Only about comments that still exist, in somas you can still open.
      responses:
        "200":
          description: Newest first, at most 50.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string, enum: [mention, reply] }
                        somaId: { type: string }
                        somaName: { type: string }
                        path: { type: string }
                        commentId: { type: integer }
                        threadId: { type: integer }
                        excerpt: { type: string }
                        actor: { $ref: "#/components/schemas/Person" }
                        createdAt: { type: string, format: date-time }
                        read: { type: boolean }
  /api/me/notifications/read:
    post:
      summary: Mark notifications as read (`ids`, or all without them)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { ids: { type: array, items: { type: integer }, maxItems: 200 } } }
      responses:
        "200": { description: How many are still unread., content: { application/json: { schema: { type: object, properties: { unread: { type: integer } } } } } }
  /api/me/avatar:
    put:
      summary: Design your avatar (shown when you have no photo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AvatarStyle" }
      responses:
        "200":
          description: Your account with the new avatar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/me/avatar/photo:
    put:
      summary: Upload a profile photo
      description: >
        A square PNG of 64 to 512 pixels, at most 1 MiB (the web app crops and scales the
        photo in the browser). The server decodes it and stores it encoded anew, without
        metadata. Error codes unsupported_type (415), too_large (413), invalid_photo (400).
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Your account; avatar.photo is the new version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove your profile photo (the designed avatar shows again)
      responses:
        "200":
          description: Your account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/users/{id}/avatar:
    get:
      summary: The profile photo of an account
      description: >
        For the account itself, admins and people who share a soma with it; anyone else
        gets 404, as for an account without photo. With v set to the current version
        (avatar.photo) the answer may be cached for good.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: v, in: query, schema: { type: integer } }
      responses:
        "200":
          description: The photo.
          content:
            image/png:
              schema: { type: string, format: binary }
        "304": { description: Not modified (If-None-Match). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /api/users/search:
    get:
      summary: Find people and groups to share a soma with (names start with q)
      description: >
        Needs at least two characters; returns at most 10 enabled accounts with id, user and
        display name only, and at most 10 groups.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Matching people.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/Person" } }
                  groups: { type: array, items: { $ref: "#/components/schemas/Group" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/somas:
    get:
      summary: Your somas (owned and shared with you)
      responses:
        "200":
          description: Somas by name, with your role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  somas: { type: array, items: { $ref: "#/components/schemas/Membership" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a new, empty soma that you own
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}:
    parameters:
      - $ref: "#/components/parameters/soma"
    patch:
      summary: Rename a soma or hand it to another member (owner)
      description: >
        Renaming keeps the folder name. A new owner must already be a member;
        the previous owner stays as editor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                ownerId: { type: integer }
      responses:
        "200": { description: The soma as you now see it., content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a soma (owner); its folder moves to SOMAS_DIR/.trash
      responses:
        "200": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/members:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: Who has access to a soma (people and groups)
      responses:
        "200":
          description: People (owner first), groups, and your own effective role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Members" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/members/{id}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/id"
    put:
      summary: Share the soma with an account or change its role (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareRole" }
      responses:
        "200": { description: The members now., content: { application/json: { schema: { $ref: "#/components/schemas/Members" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Take an account's access away (owner)
      responses:
        "200": { description: The members now., content: { application/json: { schema: { $ref: "#/components/schemas/Members" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/id"
    put:
      summary: Share the soma with a group or change the group's role (owner)
      description: Members of the group get the role; with Everyone, every enabled account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareRole" }
      responses:
        "200": { description: The members now., content: { application/json: { schema: { $ref: "#/components/schemas/Members" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Stop sharing the soma with a group (owner)
      description: Open event streams of people who lost access end at once.
      responses:
        "200": { description: The members now., content: { application/json: { schema: { $ref: "#/components/schemas/Members" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/membership:
    parameters:
      - $ref: "#/components/parameters/soma"
    delete:
      summary: Leave a soma shared with you personally (not as its owner)
      description: Access through a group stays (error not_shared_personally if that is the only one).
      responses:
        "200": { description: Left. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/tree:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: All visible files and folders of the soma
      description: Hidden entries (names starting with a dot, e.g. .trash) and ignored names are not listed.
      responses:
        "200":
          description: Entries, parents before their children.
          content:
            application/json:
              schema:
                type: object
                required: [entries, orders]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/Entry" }
                  orders:
                    type: object
                    description: How folders are sorted, by folder path ("" is the top level). Folders not listed are sorted by name.
                    additionalProperties: { $ref: "#/components/schemas/FolderOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/somas/{soma}/order:
    parameters:
      - $ref: "#/components/parameters/soma"
    put:
      summary: Set how a folder's entries are sorted
      description: >
        For everyone with access to the soma (editor and above). Folders always
        come first. Sorting by name is the default; in manual mode `names` lists
        the entries of the folder in order, and entries not listed follow by
        name. The order follows the folder when it is renamed or moved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folder, mode]
              properties:
                folder: { type: string, description: The folder; empty for the top level. }
                mode: { type: string, enum: [name, modified, created, manual] }
                names:
                  type: array
                  maxItems: 10000
                  items: { type: string }
      responses:
        "204": { description: Stored; open trees load again. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/notes/{path}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/path"
    get:
      summary: Read a note
      responses:
        "200":
          description: The note; the ETag header carries its version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    put:
      summary: Save a note
      description: Requires the version the client started from in If-Match. A change made elsewhere in the meantime answers 412 with the current ETag.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, example: '"Zm9vYmFy"' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412":
          description: Changed elsewhere (`conflict`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: conflict }
                  etag: { type: string }
        "428": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a note
      description: Missing parent folders are created. New names must not contain \ / : * ? " < > | and must not start with a dot.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteMeta" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/folders/{path}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/path"
    post:
      summary: Create a folder
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/path"
    get:
      summary: Download a file (attachments, images, media)
      description: >
        The content type follows the file extension; types not on the upload
        allow list are served as downloads. Responses carry a sandboxing CSP
        and `nosniff`, support range and conditional requests.
      responses:
        "200": { description: The file. }
        "206": { description: Part of the file (range request). }
        "304": { description: Not modified. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Upload a file
      description: >
        The request body is the raw file content (any Content-Type). The
        extension must be on the allow list and the content must match it
        (images, PDF, audio, video, text, zip). At most
        DENDRONOTES_MAX_UPLOAD_MB. Missing parent folders are created.
      parameters:
        - name: unique
          in: query
          description: With 1, a taken name gets a " (n)" suffix instead of failing with 409.
          schema: { type: string, enum: ["1"] }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored; `path` may differ from the requested one with unique=1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/drawings/{path}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/path"
    get:
      summary: Read a drawing for the editor
      description: >
        Drawings are files named `*.drawing.svg`: plain SVG with the editable
        scene as JSON in `<metadata id="dendronotes-drawing">`. Other paths get
        400 `not_a_drawing`. The ETag is also in the body.
      responses:
        "200":
          description: The drawing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drawing" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an empty drawing (contributor)
      parameters:
        - name: unique
          in: query
          description: With 1, a taken name gets a " (n)" suffix instead of failing with 409.
          schema: { type: string, enum: ["1"] }
      responses:
        "201":
          description: Created; `path` may differ from the requested one with unique=1. No `svg`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drawing" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    put:
      summary: Save a drawing (writer)
      description: >
        Replaces the whole file, guarded by `If-Match` with the drawing's ETag
        (412 when it changed meanwhile). The SVG must pass the server's check:
        well-formed, a short list of SVG elements and attributes, pictures only
        as `data:image/…` URLs, no scripts, event handlers, external
        references or CSS `url()`; otherwise 400 `invalid_drawing`. At most 8 MiB.
      parameters:
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [svg], properties: { svg: { type: string } } }
      responses:
        "200":
          description: Saved; the new ETag (no `svg`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Drawing" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "428": { description: No If-Match header (`if_match_required`). }
  /api/somas/{soma}/icons:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: The soma's icon library, by name
      responses:
        "200":
          description: The icons (without their pictures).
          content:
            application/json:
              schema: { type: object, properties: { icons: { type: array, items: { $ref: "#/components/schemas/Icon" } } } }
    post:
      summary: Add an icon to the library (contributor)
      description: >
        The request body is the picture: PNG of at most 512×512 pixels (encoded
        anew, without metadata) or SVG that passes the same check as drawings.
        At most 256 KiB and 300 icons per soma. The web app converts other
        pictures to PNG first.
      parameters:
        - { name: name, in: query, schema: { type: string, maxLength: 80 } }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/svg+xml: { schema: { type: string } }
      responses:
        "201": { description: The icon., content: { application/json: { schema: { $ref: "#/components/schemas/Icon" } } } }
        "400": { description: Not a usable PNG or SVG (`invalid_icon`) or a bad name (`invalid_name`). }
        "409": { description: The library is full (`too_many_icons`). }
        "413": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/icons/{id}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/id"
    get:
      summary: An icon's picture
      description: Served with the sandboxing CSP of files.
      responses:
        "200":
          description: The picture.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove an icon from the library (its uploader; editors any)
      description: Drawings keep their own copy of the icons they use.
      responses:
        "200": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/move:
    parameters:
      - $ref: "#/components/parameters/soma"
    post:
      summary: Rename or move a file or folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string }
                updateSynapses:
                  type: boolean
                  description: >
                    Rewrite synapses in other notes (and relative links in moved
                    notes) so that they keep pointing to the moved notes. Notes
                    changed concurrently are skipped and listed in `failed`.
      responses:
        "200":
          description: Moved; `path` is the new location.
          content:
            application/json:
              schema:
                type: object
                required: [path]
                properties:
                  path: { type: string }
                  updatedNotes: { type: integer }
                  updatedEmbeds: { type: integer, description: Embeds and links to moved attachments. }
                  updatedSynapses: { type: integer }
                  failed: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/entries/{path}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/path"
    delete:
      summary: Move a file or folder to the .trash folder of the soma
      responses:
        "200":
          description: Moved to the trash.
          content:
            application/json:
              schema:
                type: object
                properties:
                  trashedTo: { type: string, example: .trash/Projects/Idea.md }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/export:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: Download the soma as a ZIP
      description: >
        Every visible file and folder; hidden entries (.trash, .obsidian …)
        and DENDRONOTES_IGNORE patterns stay out. Notes being edited are
        saved first.
      responses:
        "200": { description: The ZIP (Content-Disposition attachment)., content: { application/zip: {} } }
  /api/somas/{soma}/comments:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: The comments on a note, oldest first
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Threads (threadId 0) and their replies, with their authors by id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments: { type: array, items: { $ref: "#/components/schemas/Comment" } }
                  people: { type: object, additionalProperties: { $ref: "#/components/schemas/Person" } }
    post:
      summary: Comment on a note, or answer in a thread (everyone with access)
      description: >
        A new thread names its note (`path`) and the text it is about: `quote`
        with up to 64 characters before (`prefix`) and after it (`suffix`), so
        the place can be found again after edits; without a quote it is about
        the whole note. A reply names its thread (`threadId`). `@user name`
        notifies that account if it has access to the soma; replies also
        notify the others in the thread. At most 5000 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                path: { type: string }
                body: { type: string }
                quote: { type: string }
                prefix: { type: string }
                suffix: { type: string }
                threadId: { type: integer }
      responses:
        "201": { description: The comment., content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "400": { description: Empty, too long or with control characters (`invalid_comment`). }
        "404": { description: The note or thread does not exist. }
        "429": { description: Too many comments in a short time (`rate_limited`). }
  /api/somas/{soma}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/id"
    patch:
      summary: Change the text of your own comment
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string } } }
      responses:
        "200": { description: The comment., content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "403": { description: Not your comment (`not_author`). }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a comment; a thread's first comment takes the replies along (your own; editors any)
      responses:
        "200": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/comments/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/id"
    post:
      summary: Mark a thread as done or open it again (writer)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [resolved], properties: { resolved: { type: boolean } } }
      responses:
        "200": { description: The thread's first comment., content: { application/json: { schema: { $ref: "#/components/schemas/Comment" } } } }
        "400": { description: A reply, not a thread (`not_a_thread`). }
        "403": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/people:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: People with access to the soma whose name starts with q (for @mentions)
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: Up to 8 people.
          content:
            application/json:
              schema: { type: object, properties: { people: { type: array, items: { $ref: "#/components/schemas/Person" } } } }
  /api/somas/{soma}/history/{path}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/path"
    get:
      summary: Earlier versions of a note, newest first
      description: >
        Every save through dendronotes is a version; saves by the same people
        within 10 minutes update the newest one. Changes made outside
        dendronotes are versions too (reason `outside`). The history follows
        renames; versions older than DENDRONOTES_HISTORY_DAYS are removed,
        except the newest of every note.
      responses:
        "200":
          description: The versions and the people who wrote them (by id; accounts that are gone are missing).
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: "#/components/schemas/Version" } }
                  people: { type: object, additionalProperties: { $ref: "#/components/schemas/Person" } }
  /api/somas/{soma}/versions/{id}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: One version with its content
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { $ref: "#/components/schemas/Version" }
                  content: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/versions/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/soma"
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      summary: Write a version back to its note (writer); open editors take it up like a change made elsewhere
      responses:
        "200": { description: The note's new version (path, etag, size, mtime). }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { description: The note changed meanwhile (`conflict`); try again. }
  /api/somas/{soma}/trash:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: What is in the trash (editor)
      description: >
        Entries deleted through dendronotes come with their original path,
        who deleted them and when. Files that were put into .trash otherwise
        (Obsidian) are listed one by one with their file time.
      responses:
        "200":
          description: >
            Newest first; `path` is relative to the trash. `keepDays`: entries are
            deleted for good this many days after `deletedAt` (0: never).
          content:
            application/json:
              schema:
                type: object
                properties:
                  keepDays: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string, example: Projects/Idea.md }
                        original: { type: string }
                        type: { type: string, enum: [file, dir] }
                        size: { type: integer }
                        files: { type: integer, description: Files inside a folder. }
                        deletedAt: { type: string, format: date-time }
                        deletedBy: { $ref: "#/components/schemas/Person" }
    delete:
      summary: Empty the trash, deleting everything in it for good (owner)
      responses:
        "200": { description: Emptied. }
        "403": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/trash/{path}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - { name: path, in: path, required: true, schema: { type: string }, description: Path relative to the trash. }
    get:
      summary: A note in the trash, for a preview (editor)
      responses:
        "200": { description: The note., content: { application/json: { schema: { $ref: "#/components/schemas/Note" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    post:
      summary: Restore an entry to where it was deleted from (editor)
      description: Missing folders are created; an occupied place gets a " (n)" suffix.
      responses:
        "200":
          description: Restored.
          content: { application/json: { schema: { type: object, properties: { path: { type: string } } } } }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete an entry in the trash for good (owner)
      responses:
        "200": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/search:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: Full-text search
      description: >
        Words match as prefixes, "quoted text" as a phrase, `#tag` filters by tag
        (nested tags included); everything must match. Case and diacritics are
        ignored.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Hits, best first. `complete` is false while the index is still being built.
          content:
            application/json:
              schema:
                type: object
                required: [hits, complete]
                properties:
                  hits: { type: array, items: { $ref: "#/components/schemas/Hit" } }
                  complete: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/somas/{soma}/backlinks/{path}:
    parameters:
      - $ref: "#/components/parameters/soma"
      - $ref: "#/components/parameters/path"
    get:
      summary: Notes with synapses to this note ("Incoming synapses")
      responses:
        "200":
          description: Referring notes in path order; a note's synapses to itself are left out.
          content:
            application/json:
              schema:
                type: object
                required: [backlinks]
                properties:
                  backlinks: { type: array, items: { $ref: "#/components/schemas/Backlink" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/somas/{soma}/tags:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: All tags with the number of notes using them
      responses:
        "200":
          description: Tags, most used first.
          content:
            application/json:
              schema:
                type: object
                required: [tags]
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      required: [tag, count]
                      properties:
                        tag: { type: string, example: garden/beds }
                        count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/somas/{soma}/graph:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: All notes and the synapses between them, and the drawings
      description: >
        Nodes are the notes (with their tags), prefixed with "?" notes that
        unresolved synapses point to, and drawings (`kind: drawing`). Edges are
        resolved synapses, at most one per direction; a note's synapses to itself
        are left out. Embeds are the notes that embed or link a drawing (not
        synapses).
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, edges, embeds]
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string, example: Projects/Garden plan.md }
                        label: { type: string, description: Name of a missing note as written. }
                        missing: { type: boolean }
                        tags: { type: array, items: { type: string } }
                        kind: { type: string, enum: [drawing], description: Only for drawings. }
                  edges:
                    type: array
                    items:
                      type: object
                      required: [source, target]
                      properties:
                        source: { type: string }
                        target: { type: string }
                  embeds:
                    type: array
                    items:
                      type: object
                      required: [source, target]
                      properties:
                        source: { type: string, description: The note. }
                        target: { type: string, description: The drawing. }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/somas/{soma}/events:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: Live updates (Server-Sent Events)
      description: >
        A `hello` event starts every stream, also after a reconnect; clients then
        reload what they show. Its `stream` id is used to join notes for editing
        together (/collab/join); a joined note's `collab`, `presence`, `saved` and
        `notice` events then arrive on this stream, only on the streams that
        joined it. `change` events report what changed in the soma, whoever
        changed it, without content. The stream ends on sign-out, when the
        account's access ends, and on shutdown.
      responses:
        "200":
          description: >
            `event: hello` with `{"ready": bool, "stream": string}`, then `event:
            change` with a Change object per change, the collab events of joined
            notes, and comment lines as heartbeat.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Change" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/collab/join:
    parameters:
      - $ref: "#/components/parameters/soma"
    post:
      summary: Open a note for editing together
      description: >
        Joins the note with the id of this tab's event stream; its updates
        arrive there from now on. `recover` brings back changes a tab made
        against a document the server no longer has (restart, long absence):
        they are merged into the current one (3-way, line by line; clashing
        lines are kept side by side).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream, path]
              properties:
                stream: { type: string }
                path: { type: string }
                recover:
                  type: object
                  properties:
                    doc: { type: string }
                    base: { type: string, description: The text the tab had confirmed. }
                    mine: { type: string, description: The tab's text. }
      responses:
        "200": { description: The document., content: { application/json: { schema: { $ref: "#/components/schemas/Joined" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "`unknown_stream`: the stream is gone (reconnect, then join again)." }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/collab/leave:
    parameters:
      - $ref: "#/components/parameters/soma"
    post:
      summary: Close a note for this tab (the last one out saves)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollabTarget" }
      responses:
        "200": { description: Left. }
        "409": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/collab/push:
    parameters:
      - $ref: "#/components/parameters/soma"
    post:
      summary: Send changes made on top of a version (editors)
      description: >
        `updates` are CodeMirror change sets (ChangeSet.toJSON, positions in
        UTF-16 units) with the client id. Accepted only on the current version;
        everyone in the note, the sender included, receives them as a `collab`
        event (the sender's confirmation). The server writes the note about a
        second after changes stop (at the latest after five), or at once with
        `save`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream, path, doc, version, updates]
              properties:
                stream: { type: string }
                path: { type: string }
                doc: { type: string }
                version: { type: integer }
                updates:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/Update" }
                save: { type: boolean }
      responses:
        "200": { description: Accepted; the new version., content: { application/json: { schema: { type: object, properties: { version: { type: integer } } } } } }
        "400": { description: "`invalid_update`: the change set does not fit the document." }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: "`version_mismatch` with the current `version` (catch up with /pull, rebase, retry), or `unknown_stream`." }
        "410": { description: "`resync`: the document was closed or replaced; join again." }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/somas/{soma}/collab/pull:
    parameters:
      - $ref: "#/components/parameters/soma"
    get:
      summary: Updates after a version (catching up after a gap)
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: doc, in: query, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The updates and the current version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates: { type: array, items: { $ref: "#/components/schemas/Update" } }
                  version: { type: integer }
        "410": { description: "`resync`: too far behind or another document; join again." }
  /api/somas/{soma}/collab/presence:
    parameters:
      - $ref: "#/components/parameters/soma"
    post:
      summary: Share this tab's cursor with the others in the note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CollabTarget"
                - type: object
                  properties:
                    doc: { type: string }
                    sel:
                      type: [object, "null"]
                      properties:
                        anchor: { type: integer }
                        head: { type: integer }
      responses:
        "200": { description: Shared. }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/admin/users:
    get:
      summary: All accounts (admin)
      responses:
        "200": { description: Accounts., content: { application/json: { schema: { type: object, properties: { users: { type: array, items: { $ref: "#/components/schemas/User" } } } } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a local account (admin); it gets a first soma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string }
                displayName: { type: string }
                email: { type: string }
                password: { type: string, minLength: 10, description: Required unless a welcome email lets the person choose it. }
                role: { type: string, enum: [admin, user] }
                sendWelcome: { type: boolean, description: "Email the account its user name (needs an address and configured email); without a password, with a link to choose one (7 days)." }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      summary: Change display name, e-mail, role or the disabled flag (admin)
      description: The last enabled admin can be neither demoted nor disabled (409 last_admin). Disabling ends the account's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                email: { type: string }
                role: { type: string, enum: [admin, user] }
                disabled: { type: boolean }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete an account (admin)
      description: Its somas go to the account in transferTo, or to the trash without it.
      parameters:
        - { name: transferTo, in: query, schema: { type: integer } }
      responses:
        "200": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      summary: Set a local account's password (admin); its sessions end
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string, minLength: 10 } } }
      responses:
        "200": { description: Set. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      summary: End all sessions of an account (admin; your own current one stays)
      responses:
        "200": { description: Ended. }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/groups:
    get:
      summary: All groups, Everyone first (admin)
      responses:
        "200":
          description: Groups with their number of members.
          content:
            application/json:
              schema: { type: object, properties: { groups: { type: array, items: { $ref: "#/components/schemas/Group" } } } }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a group (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      summary: Rename a group (admin; not Everyone or directory groups)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 } } }
      responses:
        "200": { description: Renamed., content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a group and its shares (admin; not Everyone)
      responses:
        "200": { description: Deleted. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/groups/{id}/members:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: The accounts in a group (admin; Everyone has no list)
      responses:
        "200": { description: The group and its members. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/groups/{id}/members/{user}:
    parameters:
      - $ref: "#/components/parameters/id"
      - { name: user, in: path, required: true, schema: { type: integer } }
    put:
      summary: Add an account to a group (admin; not to directory groups, their members come from the directory)
      responses:
        "200": { description: The group and its members. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Take an account out of a group (admin); its open streams of somas it lost end
      responses:
        "200": { description: The group and its members. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/users/{id}/tokens:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      summary: Revoke all API tokens of an account (admin)
      responses:
        "200": { description: How many were revoked., content: { application/json: { schema: { type: object, properties: { revoked: { type: integer } } } } } }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/somas:
    get:
      summary: All somas with owner, members, groups and size (admin)
      responses:
        "200": { description: Somas. }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a soma for any account, optionally shared with a group (admin)
      description: >
        The owner gets the soma like one they created themselves; with group, the group gets the
        role right away (the owner shares further in the soma). Errors invalid_name,
        unknown_user, unknown_group, invalid_role (400) and too_many_somas (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ownerId]
              properties:
                name: { type: string, maxLength: 100 }
                ownerId: { type: integer }
                group:
                  type: object
                  required: [id, role]
                  properties:
                    id: { type: integer }
                    role: { type: string, enum: [editor, contributor, writer, viewer] }
      responses:
        "201": { description: Created. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/somas/{soma}:
    parameters:
      - { name: soma, in: path, required: true, schema: { type: string } }
    patch:
      summary: Transfer a soma to another owner (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ownerId], properties: { ownerId: { type: integer } } }
      responses:
        "200": { description: Transferred; the previous owner stays as editor. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a soma (admin); its folder moves to SOMAS_DIR/.trash and it can be restored
      responses:
        "200": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/somas/deleted:
    get:
      summary: Deleted somas that can be restored (admin)
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  somas:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        folder: { type: string, description: Where its files are now (in SOMAS_DIR/.trash, or absolute for an imported soma). }
                        originalFolder: { type: string }
                        owner: { $ref: "#/components/schemas/Person" }
                        members: { type: integer }
                        groups: { type: integer }
                        createdAt: { type: string, format: date-time }
                        deletedBy: { $ref: "#/components/schemas/Person" }
                        deletedAt: { type: string, format: date-time }
  /api/admin/somas/deleted/{id}/restore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Restore a deleted soma with its shares, as far as their accounts and groups still exist (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerId: { type: integer, description: The owner; required when the old one is gone (`owner_required`). }
      responses:
        "200": { description: The restored soma. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: Its folder is gone (`folder_missing`). }
  /api/admin/somas/deleted/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Delete a deleted soma for good, its files in the trash too (an imported folder stays) (admin)
      responses:
        "200": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/sessions:
    get:
      summary: All valid sessions (admin); `current` is the caller's
      responses:
        "200": { description: Sessions. }
  /api/admin/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      summary: End one session (admin)
      responses:
        "200": { description: Ended. }
        "404": { $ref: "#/components/responses/Error" }
  /api/admin/server:
    get:
      summary: Server state, storage, open somas and effective configuration (admin; secrets only as "(set)")
      responses:
        "200": { description: Server state. }
  /api/admin/banners:
    get:
      summary: All banners, newest first (admin)
      responses:
        "200":
          description: Banners.
          content:
            application/json:
              schema:
                type: object
                properties:
                  banners: { type: array, items: { $ref: "#/components/schemas/Banner" } }
    post:
      summary: Publish a banner (admin); open tabs load their banners again
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerInput" }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/Banner" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/admin/banners/{id}:
    patch:
      summary: Change a banner (admin; all fields); a changed text shows again to those who closed it
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerInput" }
      responses:
        "200": { description: Changed., content: { application/json: { schema: { $ref: "#/components/schemas/Banner" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { description: No such banner. }
    delete:
      summary: Delete a banner (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted. }
        "404": { description: No such banner. }
  /api/admin/mail/test:
    post:
      summary: Send a test email to your own address at once (admin)
      responses:
        "200": { description: The relay took the message. }
        "400": { description: Your account has no email address (`no_email`). }
        "404": { description: Email is not configured. }
        "502": { description: "The relay refused or could not be reached (`mail_failed`, with `detail`)." }
  /api/admin/sso/check:
    post:
      summary: Ask the OpenID Connect provider again (discovery) and report its state (admin)
      responses:
        "200": { description: Provider state (as `sso` in /api/admin/server). }
        "404": { description: OpenID Connect is not configured. }
  /api/admin/backup:
    get:
      summary: Download a backup of state.db and the note histories (admin)
      description: >
        Consistent copies made while the server runs, as a ZIP with a
        manifest. To restore, stop dendronotes and unpack it into
        DENDRONOTES_DATA_DIR. The notes themselves (SOMAS_DIR) need a backup
        of their own.
      responses:
        "200": { description: The ZIP., content: { application/zip: {} } }
  /api/admin/ldap/sync:
    post:
      summary: Check all directory accounts now (admin)
      description: >
        Accounts that are gone, disabled in the directory or no longer in an
        allowed group are signed out everywhere and lose their API tokens;
        the others take over name, e-mail, role and groups. If most accounts
        are missing at once, nobody is signed out (a wrong setting is more
        likely). Runs on its own every DENDRONOTES_LDAP_SYNC_INTERVAL.
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  interval: { type: string }
                  running: { type: boolean }
                  lastRun: { type: string, format: date-time }
                  lastSuccess: { type: string, format: date-time }
                  accounts: { type: integer }
                  updated: { type: integer }
                  signedOut: { type: integer }
                  error: { type: string }
        "404": { description: LDAP is not configured. }
        "409": { description: A sync is running (`sync_running`). }
  /api/admin/ldap/check:
    post:
      summary: Connect to the directory with the service account and read the base DN (admin)
      responses:
        "200":
          description: Directory state (as `ldap` in /api/admin/server; null there without LDAP).
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  baseDN: { type: string }
                  bindDN: { type: string }
                  groupBaseDN: { type: string }
                  ready: { type: boolean }
                  checkedAt: { type: string, format: date-time }
                  error: { type: string }
        "404": { description: LDAP is not configured. }
  /api/admin/audit:
    get:
      summary: Audit log, newest first (admin)
      parameters:
        - { name: before, in: query, schema: { type: integer }, description: Only entries with a smaller id (paging). }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: Entries. }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-dendronotes_session
      description: >
        Session cookie (named dendronotes_session over plain HTTP). In proxy
        mode the reverse proxy authenticates every request instead.
    bearer:
      type: http
      scheme: bearer
      description: >
        A personal API token (dn_…), created in the profile. "read" tokens only
        read (GET); "write" tokens also change notes, folders and files. No
        token manages anything: administration, sharing, renaming or deleting
        somas, the trash's final deletion, the account and its tokens answer
        403 `token_not_allowed`. Wrong tokens answer 401, and after a few of
        them 429.
  parameters:
    soma:
      name: soma
      in: path
      required: true
      description: Id of a soma the caller is a member of (non-members get 404).
      schema: { type: string, example: k3xq7m2a9b }
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    path:
      name: path
      in: path
      required: true
      description: Soma-relative path, URL-encoded per segment.
      schema: { type: string, example: Projects/Idea.md }
  responses:
    Unauthorized:
      description: Not signed in (`unauthorized`); `mode` tells the client how to sign in.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, const: unauthorized }
              mode: { type: string, enum: [local, proxy] }
    Error:
      description: Error with a stable code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >
            One of invalid_path, invalid_name, not_found, exists, not_a_note,
            read_only, too_large, is_directory, not_a_directory, move_into_self,
            if_match_required, content_required, bad_request,
            unsupported_media_type, cross_origin_request, query_too_long,
            invalid_limit, too_many_streams, unsupported_type, forbidden,
            invalid_credentials, account_disabled, rate_limited, wrong_password,
            weak_password, not_local, invalid_username, username_taken,
            invalid_role, invalid_display_name, invalid_email, last_admin, self,
            invalid_transfer, too_many_somas, unknown_user, owner_cannot_leave,
            managed_by_provider, not_available, unknown_stream, resync,
            builtin_group, directory_group, name_taken, directory_unavailable,
            account_not_allowed, owner_required, folder_missing, invalid_comment,
            not_author, not_a_thread, token_not_allowed, invalid_scope,
            invalid_expiry, too_many_tokens,
            version_mismatch, invalid_update, shutting_down, internal_error.
    Readiness:
      type: object
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          properties:
            server: { type: string, enum: [ok, starting, shutting_down] }
            state: { type: string, enum: [ok, unavailable] }
            somas: { type: string, enum: [ok, unavailable] }
    Me:
      type: object
      required: [user, mode]
      properties:
        user: { $ref: "#/components/schemas/User" }
        mode: { type: string, enum: [local, proxy] }
        logoutUrl: { type: string }
        mail: { type: boolean, description: Email is configured. }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, user] }
        source: { type: string, enum: [local, oidc, proxy, ldap] }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
        avatar: { $ref: "#/components/schemas/Avatar" }
        mailComments: { type: boolean }
        mailShares: { type: boolean }
    ShownBanner:
      type: object
      properties:
        id: { type: integer }
        message: { type: string, description: Short Markdown (bold, italic, code, links). }
        kind: { type: string, enum: [info, warning, critical] }
        dismissible: { type: boolean }
        revision: { type: integer, description: Grows when the text changes. }
    BannerInput:
      type: object
      required: [message, kind, audience]
      properties:
        message: { type: string, maxLength: 1000 }
        kind: { type: string, enum: [info, warning, critical] }
        onLogin: { type: boolean, description: On the sign-in page (only with audience everyone). }
        inApp: { type: boolean }
        audience: { type: string, enum: [everyone, admins, group] }
        groupId: { type: integer, description: With audience group; the group Everyone means everyone. }
        dismissible: { type: boolean }
        startsAt: { type: [string, "null"], format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
    Banner:
      allOf:
        - $ref: "#/components/schemas/BannerInput"
        - type: object
          properties:
            id: { type: integer }
            groupName: { type: string }
            revision: { type: integer }
            createdBy: { $ref: "#/components/schemas/Person" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    AvatarStyle:
      type: object
      required: [color, pattern, initials]
      properties:
        color: { type: integer, minimum: 0, maximum: 7 }
        pattern: { type: string, enum: [plain, dendrite, rings, vesicles] }
        initials: { type: string, maxLength: 2, description: Up to two letters or digits; empty means derived from the name. }
    Avatar:
      allOf:
        - $ref: "#/components/schemas/AvatarStyle"
        - type: object
          properties:
            photo: { type: integer, description: Version of the uploaded photo (GET /api/users/{id}/avatar?v=…), 0 when there is none. }
    CollabTarget:
      type: object
      required: [stream, path]
      properties:
        stream: { type: string, description: Id from the event stream's hello. }
        path: { type: string }
    Update:
      type: object
      required: [clientID, changes]
      properties:
        clientID: { type: string, maxLength: 64 }
        changes:
          type: array
          description: >
            ChangeSet.toJSON(): a number keeps that many UTF-16 units, [n] deletes
            n, [n, "line", …] replaces n with the lines joined by "\n".
    Joined:
      type: object
      properties:
        doc: { type: string, description: Id of this document instance. }
        version: { type: integer }
        text: { type: string, description: The note with "\n" line breaks and without byte order mark. }
        readOnly: { type: boolean }
        saved: { type: integer, description: Version written to the file. }
        peer: { type: string, description: Your id among the peers. }
        peers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              user: { type: integer, description: Id of the account. }
              name: { type: string }
              avatar: { $ref: "#/components/schemas/Avatar" }
              color: { type: integer, minimum: 0, maximum: 7 }
              sel: { type: object, properties: { anchor: { type: integer }, head: { type: integer } } }
        conflict: { type: boolean }
    APIToken:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        scope: { type: string, enum: [read, write] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Missing when it never expires. }
        lastUsedAt: { type: string, format: date-time }
        lastUsedIp: { type: string }
    Comment:
      type: object
      properties:
        id: { type: integer }
        path: { type: string }
        threadId: { type: integer, description: 0 for the first comment of a thread, else that comment's id. }
        authorId: { type: integer, description: 0 when the account is gone. }
        body: { type: string }
        quote: { type: string }
        prefix: { type: string }
        suffix: { type: string }
        createdAt: { type: string, format: date-time }
        editedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: integer }
    Version:
      type: object
      properties:
        id: { type: integer }
        path: { type: string }
        at: { type: string, format: date-time }
        authors: { type: array, items: { type: integer }, description: Accounts that changed the note in this version. }
        reason: { type: string, enum: [edit, create, outside, relink, restore] }
        size: { type: integer }
        restoredFrom: { type: integer, description: The version a restore brought back. }
    Drawing:
      type: object
      required: [path, etag]
      properties:
        path: { type: string }
        svg: { type: string, description: Only when reading. }
        etag: { type: string }
    Icon:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        mime: { type: string, enum: [image/png, image/svg+xml] }
        size: { type: integer }
        createdBy: { type: integer }
        createdAt: { type: string, format: date-time }
    Person:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        displayName: { type: string }
        avatar: { $ref: "#/components/schemas/Avatar", description: Only in member lists. }
    Role:
      type: string
      enum: [owner, editor, contributor, writer, viewer]
      description: >
        From most to least, each including the ones below: owner (sharing, renaming and
        deleting the soma), editor (rename, move, delete), contributor (create notes, folders,
        files), writer (change existing notes), viewer (read).
    ShareRole:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [editor, contributor, writer, viewer] }
    Group:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        everyone: { type: boolean, description: The built-in group of every enabled account. }
        source:
          type: string
          enum: [local, ldap]
          description: ldap groups mirror a directory group; name and members come from the directory at sign-in.
        members: { type: integer }
        createdAt: { type: string, format: date-time }
    Members:
      type: object
      properties:
        role: { $ref: "#/components/schemas/Role", description: Your effective role. }
        members:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Person"
              - type: object
                properties:
                  role: { $ref: "#/components/schemas/Role" }
        groups:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Group"
              - type: object
                properties:
                  role: { type: string, enum: [editor, contributor, writer, viewer] }
    Membership:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role", description: "Effective: the highest of your personal share and your groups'." }
        direct: { type: boolean, description: Shared with you personally (only then can you leave it). }
        owner:
          type: object
          properties:
            id: { type: integer }
            username: { type: string }
            displayName: { type: string }
    Entry:
      type: object
      required: [path, type, mtime]
      properties:
        path: { type: string }
        type: { type: string, enum: [file, dir] }
        size: { type: integer }
        mtime: { type: integer, description: Unix milliseconds }
        ctime: { type: integer, description: "When the entry was created (Unix milliseconds), where the system keeps it; otherwise the time of the last change." }
        readOnly: { type: boolean, description: True for symbolic links inside the soma. }
    FolderOrder:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [modified, created, manual] }
        names: { type: array, items: { type: string }, description: Manual mode only. }
    Note:
      type: object
      required: [path, content, etag, size, mtime]
      properties:
        path: { type: string }
        content: { type: string }
        etag: { type: string }
        size: { type: integer }
        mtime: { type: integer }
        readOnly: { type: boolean }
    NoteMeta:
      type: object
      required: [path, etag, size, mtime]
      properties:
        path: { type: string }
        etag: { type: string }
        size: { type: integer }
        mtime: { type: integer }
    Hit:
      type: object
      required: [path, snippet, line]
      properties:
        path: { type: string }
        snippet:
          type: string
          description: >
            Text around the match; matched words are enclosed in U+0002 and
            U+0003 (never HTML).
        line: { type: integer, description: First line with a match (0-based), -1 if only the name matched. }
        tags: { type: array, items: { type: string } }
    Backlink:
      type: object
      required: [path, synapses]
      properties:
        path: { type: string }
        synapses:
          type: array
          items:
            type: object
            required: [line, context]
            properties:
              line: { type: integer, description: 0-based line in the referring note }
              context: { type: string, description: That line, shortened. }
              embed: { type: boolean }
    Change:
      type: object
      required: [tree, notes, removed]
      properties:
        tree: { type: boolean, description: Files or folders appeared or disappeared; reload the tree. }
        notes:
          type: array
          description: Notes with new content, with their new ETag.
          items:
            type: object
            required: [path, etag]
            properties:
              path: { type: string }
              etag: { type: string }
        removed: { type: array, items: { type: string } }
